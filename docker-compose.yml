services:
  mobywatel:
    build: .
    env_file: .env
    environment:
      # W Dockerze serwer musi nasłuchiwać na wszystkich interfejsach (0.0.0.0),
      # żeby port 8790 był osiągalny z hosta. W .env jest HOST=127.0.0.1, co jest
      # bezpieczne przy uruchomieniu bez Dockera, ale env_file nadpisuje tu
      # wartość z Dockerfile, więc jawnie przywracamy 0.0.0.0.
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8790:8790"
    restart: unless-stopped
